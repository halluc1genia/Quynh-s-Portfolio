<!DOCTYPE html>

            id="navTrigger"

        ></div>


        <div
            id="navBox"
            class="nav-box"
        >


            <!-- LEFT -->

            <button
                id="navLeft"
                class="nav-arrow nav-left"
                type="button"
            >

                <img
                    src="../Images/Nav/Left.png"
                    alt=""
                >

            </button>


            <!-- PAGES -->

            <div class="nav-items">


                <a
                    class="nav-item"
                    href="../Home/index.html"
                >

                    <img
                        src="../Images/Nav/Home.png"
                        alt="Home"
                    >

                </a>


                <a
                    class="nav-item"
                    href="../About/about.html"
                >

                    <img
                        src="../Images/Nav/About.png"
                        alt="About"
                    >

                </a>


                <a
                    class="nav-item"
                    href="../Contact/contact.html"
                >

                    <img
                        src="../Images/Nav/Contact.png"
                        alt="Contact"
                    >

                </a>


                <a
                    class="nav-item"
                    href="../Work/work.html"
                >

                    <img
                        src="../Images/Nav/Work.png"
                        alt="Work"
                    >

                </a>


            </div>


            <!-- RIGHT -->

            <button
                id="navRight"
                class="nav-arrow nav-right"
                type="button"
            >

                <img
                    src="../Images/Nav/Right.png"
                    alt=""
                >

            </button>


        </div>

    </button>

        <div id="run-wrapper">

        ================================================== -->

        <a

            href="mailto:quynhquynhh.2516@gmail.com"

             CONTACT TEXT
        ================================================== -->

        <a
            id="fb-text"
            class="contact-text"
            href="https://www.facebook.com/quynh.quynh.224922"
