<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home</title>


    <link
        rel="stylesheet"
        href="../Load/load.css"
    >

    <link
        rel="stylesheet"
        href="../Nav/nav.css"
    >

    <link
        rel="stylesheet"
        href="home.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav
        id="nav"
        class="nav"
    >

        <div
            id="navTrigger"
            class="nav-trigger"
        ></div>


        <div
            id="navBox"
            class="nav-box"
        >


            <!-- LEFT -->

            <button
                id="navLeft"
                class="nav-arrow nav-left"
                type="button"
            >

                <img
                    src="../Images/Nav/Left.png"
                    alt=""
                >

            </button>


            <!-- PAGES -->

            <div class="nav-items">


                <a
                    class="nav-item"
                    href="../Home/home.html"
                >

                    <img
                        src="../Images/Nav/Home.png"
                        alt="Home"
                    >

                </a>


                <a
                    class="nav-item"
                    href="../About/about.html"
                >

                    <img
                        src="../Images/Nav/About.png"
                        alt="About"
                    >

                </a>


                <a
                    class="nav-item"
                    href="../Contact/contact.html"
                >

                    <img
                        src="../Images/Nav/Contact.png"
                        alt="Contact"
                    >

                </a>


                <a
                    class="nav-item"
                    href="../Work/work.html"
                >

                    <img
                        src="../Images/Nav/Work.png"
                        alt="Work"
                    >

                </a>


            </div>


            <!-- RIGHT -->

            <button
                id="navRight"
                class="nav-arrow nav-right"
                type="button"
            >

                <img
                    src="../Images/Nav/Right.png"
                    alt=""
                >

            </button>


        </div>

    </nav>



    <!-- =====================================================
         DEVIL BUTTON
    ====================================================== -->

    <button
        id="devilButton"
        class="devil-button"
        type="button"
        aria-label="Toggle navigation"
    >

        <img
            id="devilIcon"
            class="devil-icon"
            src="../Images/Nav/off.png"
            alt=""
        >

    </button>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- BACKGROUND -->

        <div id="background"></div>


        <!-- DITHER -->

        <canvas
            id="dither"
        ></canvas>



        <!-- =================================================
             FACE
        ================================================== -->

        <canvas
            id="faceBacking"
        ></canvas>

        <canvas
            id="faceCanvas"
        ></canvas>



        <!-- =================================================
             HAND
        ================================================== -->

        <canvas
            id="handBacking"
        ></canvas>

        <canvas
            id="handCanvas"
        ></canvas>



        <!-- =================================================
             RIGHT EYE
        ================================================== -->

        <div class="eye-box">

            <img
                id="righteye"
                src="../Images/Home/Right eye.png"
                alt="Right eye"
            >

        </div>



        <!-- =================================================
             NAME
        ================================================== -->

        <img
            id="nameLogo"
            src="../Images/Home/quynh.svg"
            alt="Quynh"
        >



        <!-- =================================================
             FLOATING ASSETS
        ================================================== -->

        <img
            id="floatingDevil"
            class="floating-asset"
            src="../Images/Home/Entertain/devil.png"
            alt=""
        >


        <img
            id="floatingHappy"
            class="floating-asset"
            src="../Images/Home/Entertain/happyface.png"
            alt=""
        >


    </main>



    <!-- =====================================================
         DEVIL TRIGGER
    ====================================================== -->

    <button
        class="devil-trigger"
        id="devilTrigger"
        aria-label="Open navigation"
    >

        <span class="devil-face">

            <span class="devil-horns"></span>

            <span class="devil-eyes">

                <span></span>
                <span></span>

            </span>

            <span class="devil-mouth"></span>

        </span>

    </button>



    <!-- =====================================================
         SPEECH BUBBLES
    ====================================================== -->


    <!-- =================================================
         CLOUD RIGHT
    ================================================== -->

    <div
        id="cloudright"
        class="speech-bubble speech-cloud-right"
    >

        <img
            src="../Images/Home/Entertain/cloud right.png"
            alt=""
        >


        <div class="bubble-text">

            <a
                href="../About/about.html"
                class="about-bubble-link"
            >

                <span>
                    Do you know
                </span>

                <span class="red-word">
                    me
                </span>

                <span>
                    ?
                </span>

            </a>

        </div>

    </div>



    <!-- =================================================
         STAR RIGHT
    ================================================== -->

    <div
        id="starright"
        class="speech-bubble speech-star-right"
    >

        <img
            src="../Images/Home/Entertain/starright.png"
            alt=""
        >


        <div class="bubble-text">

            <span>
                hello!
            </span>

        </div>

    </div>



    <!-- =================================================
         CLOUD LEFT
    ================================================== -->

    <div
        id="cloudleft"
        class="speech-bubble speech-cloud-left"
    >

        <img
            src="../Images/Home/Entertain/cloud left.png"
            alt=""
        >


        <div class="bubble-text">

            <span>
                Guess my&nbsp;
            </span>


            <button
                id="moodTrigger"
                class="mood-link"
                type="button"
            >
                mood
            </button>


            <span>
                !
            </span>

        </div>

    </div>



    <!-- =====================================================
         CURRENT MOOD MODAL
    ====================================================== -->

    <div
        id="moodModal"
        class="mood-modal"
        aria-hidden="true"
    >


        <div
            class="mood-window"
            role="dialog"
            aria-modal="true"
            aria-labelledby="moodTitle"
        >


            <!-- CLOSE -->

            <button
                id="moodClose"
                class="mood-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>



            <!-- =================================================
                 TAB TITLE
            ================================================== -->

            <div class="mood-header">

                <h2 id="moodTitle">
                    CURRENT MOOD
                </h2>

            </div>



            <!-- =================================================
                 MOOD CONTENT
            ================================================== -->

            <div class="mood-content">


                <p class="mood-feeling">
                    feeling happy &amp; pretty &lt;3
                </p>



                <!-- =================================================
                     MASCOT
                ================================================== -->

                <div class="mood-mascot-area">


                    <!-- MASCOT -->

                    <img
                        class="mood-mascot"
                        src="../Images/Home/Entertain/mascot.png"
                        alt=""
                    >


                    <!-- =================================================
                         FLY FRAMES
                    ================================================== -->

                    <div class="mood-fly">


                        <img
                            class="mood-fly-frame mood-fly-1 is-active"
                            src="../Images/Home/Entertain/fly1.png"
                            alt=""
                        >


                        <img
                            class="mood-fly-frame mood-fly-2"
                            src="../Images/Home/Entertain/fly2.png"
                            alt=""
                        >


                        <img
                            class="mood-fly-frame mood-fly-3"
                            src="../Images/Home/Entertain/fly3.png"
                            alt=""
                        >


                    </div>


                </div>


            </div>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="home.js"></script>

    <script src="entertain.js"></script>

    <script src="../Load/load.js"></script>

    <script src="../Nav/nav.js"></script>


</body>

</html>
